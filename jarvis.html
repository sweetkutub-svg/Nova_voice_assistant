<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nova - Voice assistant</title>
  <meta name="theme-color" content="#0b0d1a" id="meta-theme">
  <script>
    /* Theme ko paint se pehle set karta hai (flash na ho). Saved choice > system setting. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('nova-theme'); } catch (e) { }
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* ===== DARK THEME (default) ===== */
      color-scheme: dark;
      --ink: #0b0d1a;
      --surface: rgba(255, 255, 255, .045);
      --surface-2: rgba(255, 255, 255, .08);
      --line: rgba(255, 255, 255, .1);
      --text: #eceefb;
      --muted: #8a90ad;
      --h: 200;
      --as: 90%;
      --al: 70%;
      --accent: hsl(var(--h) var(--as) var(--al));
      --accent-soft: hsl(var(--h) var(--as) var(--al) / .16);
      --on-accent: #0b0d1a;
      --danger: #ff6b85;
      --chip-text: #cfd3ea;
      --chip-hover-text: #ffffff;
      --input-bg: rgba(0, 0, 0, .25);
      --placeholder: #666d88;
      --glow-1: hsl(var(--h) 80% 45% / .18);
      --glow-2: rgba(120, 90, 255, .12);
      --video-op: .28;
      --card-shadow: none;
      --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    /* ===== LIGHT THEME ===== */
    :root[data-theme="light"] {
      color-scheme: light;
      --ink: #f3f5fc;
      --surface: rgba(255, 255, 255, .66);
      --surface-2: rgba(25, 32, 70, .055);
      --line: rgba(25, 32, 70, .12);
      --text: #161a33;
      --muted: #596083;
      --as: 78%;
      --al: 42%;
      --on-accent: #ffffff;
      --danger: #d6385a;
      --chip-text: #38405f;
      --chip-hover-text: #161a33;
      --input-bg: rgba(255, 255, 255, .75);
      --placeholder: #8b92b0;
      --glow-1: hsl(var(--h) 85% 68% / .34);
      --glow-2: rgba(150, 120, 255, .20);
      --video-op: .10;
      --card-shadow: 0 18px 50px -28px rgba(30, 40, 100, .35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      background: var(--ink);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased
    }

    body {
      overflow: hidden
    }

    button,
    input {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      background: none;
      border: 0
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 10px
    }

    #video-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -3;
      opacity: var(--video-op);
      filter: saturate(.7) blur(2px)
    }

    .wash {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(60% 55% at 38% 45%, var(--glow-1), transparent 70%),
        radial-gradient(50% 50% at 90% 100%, var(--glow-2), transparent 70%),
        var(--ink);
      transition: background .8s
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      padding: 18px 22px;
      padding-top: max(18px, env(safe-area-inset-top));
      padding-bottom: max(18px, env(safe-area-inset-bottom))
    }

    /* top bar */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: conic-gradient(from 200deg, var(--accent), #8d6bff, var(--accent));
      display: grid;
      place-items: center;
      transition: filter .6s
    }

    .logo::after {
      content: "";
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--ink)
    }

    .brand b {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -.01em;
      display: block
    }

    .brand small {
      font-size: 12.5px;
      color: var(--muted)
    }

    .pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      font-size: 13px;
      color: var(--muted);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px)
    }

    .pill b {
      color: var(--text);
      font-weight: 500
    }

    .led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7a8099
    }

    .led.ok {
      background: #6df0b0;
      box-shadow: 0 0 10px #6df0b0
    }

    .led.bad {
      background: var(--danger);
      box-shadow: 0 0 10px var(--danger)
    }

    .led.wait {
      background: #ffd166
    }

    /* layout */
    .main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 16px
    }

    .stage,
    .chat {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 28px;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      min-height: 0
    }

    /* stage */
    .stage {
      position: relative;
      display: grid;
      grid-template-rows: 1fr auto auto;
      justify-items: center;
      padding: 22px 22px 24px;
      overflow: hidden
    }

    .orb-wrap {
      position: relative;
      width: 100%;
      min-height: 0;
      display: grid;
      place-items: center
    }

    #orb {
      width: 100%;
      height: 100%;
      max-height: 520px;
      display: block
    }

    .readout {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 6px;
      text-align: center;
      pointer-events: none
    }

    .readout h1 {
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 500;
      letter-spacing: -.03em;
      line-height: 1.05
    }

    .readout p {
      margin-top: 8px;
      font-size: 15px;
      color: var(--muted)
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 20px
    }

    .mic {
      position: relative;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--on-accent);
      background: var(--accent);
      box-shadow: 0 10px 40px -8px var(--accent);
      transition: transform .2s, background .4s, box-shadow .4s
    }

    .mic:hover {
      transform: scale(1.06)
    }

    .mic:active {
      transform: scale(.96)
    }

    .mic svg {
      width: 28px;
      height: 28px
    }

    .mic .stop {
      display: none
    }

    .mic.active {
      background: var(--danger);
      box-shadow: 0 10px 40px -8px var(--danger)
    }

    .mic.active .m {
      display: none
    }

    .mic.active .stop {
      display: block
    }

    .mic.active::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid var(--danger);
      animation: ring 1.4s ease-out infinite
    }

    @keyframes ring {
      from {
        transform: scale(.9);
        opacity: .9
      }

      to {
        transform: scale(1.5);
        opacity: 0
      }
    }

    .cap {
      font-size: 13px;
      color: var(--muted)
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 18px;
      max-width: 640px
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 15px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 14px;
      color: var(--chip-text);
      transition: background .2s, border-color .2s, color .2s
    }

    .chip:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--chip-hover-text)
    }

    .chip svg {
      width: 16px;
      height: 16px;
      opacity: .85
    }

    /* chat */
    .chat {
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    .chat-head {
      padding: 18px 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .chat-head h2 {
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -.01em
    }

    .clear {
      font-size: 13px;
      color: var(--muted);
      padding: 5px 10px;
      border-radius: 999px
    }

    .clear:hover {
      background: var(--surface-2);
      color: var(--text)
    }

    .log {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 4px 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth
    }

    .log::-webkit-scrollbar {
      width: 4px
    }

    .log::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 4px
    }

    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.6;
      max-width: 250px
    }

    .empty strong {
      display: block;
      color: var(--text);
      font-weight: 500;
      font-size: 16px;
      margin-bottom: 6px
    }

    .msg {
      max-width: 88%;
      padding: 11px 14px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      animation: pop .25s ease
    }

    @keyframes pop {
      from {
        transform: translateY(6px);
        opacity: 0
      }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: var(--on-accent);
      border-bottom-right-radius: 6px
    }

    .msg.nova {
      align-self: flex-start;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px
    }

    .composer {
      margin: 0 14px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 6px 6px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--input-bg)
    }

    .composer:focus-within {
      border-color: var(--accent)
    }

    .composer input {
      flex: 1;
      min-width: 0;
      background: none;
      border: 0;
      outline: 0;
      font-size: 14.5px
    }

    .composer input::placeholder {
      color: var(--placeholder)
    }

    .send {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--on-accent);
      display: grid;
      place-items: center;
      flex: none
    }

    .send svg {
      width: 18px;
      height: 18px
    }

    /* theme toggle */
    .theme-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      display: grid;
      place-items: center;
      flex: none;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: background .2s, border-color .2s, transform .2s
    }

    .theme-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft)
    }

    .theme-btn:active {
      transform: scale(.92)
    }

    .theme-btn svg {
      width: 18px;
      height: 18px
    }

    .theme-btn .i-moon {
      display: none
    }

    :root[data-theme="light"] .theme-btn .i-sun {
      display: none
    }

    :root[data-theme="light"] .theme-btn .i-moon {
      display: block
    }

    body,
    .stage,
    .chat,
    .pill,
    .composer,
    .msg {
      transition: background-color .35s, border-color .35s, color .35s
    }

    /* responsive */
    @media(max-width:1000px) {
      .main {
        grid-template-columns: minmax(0, 1fr) 320px
      }
    }

    @media(max-width:820px) {
      body {
        overflow: auto
      }

      .app {
        height: auto;
        min-height: 100dvh;
        padding: 14px
      }

      .main {
        grid-template-columns: 1fr
      }

      .stage {
        min-height: 600px
      }

      .chat {
        height: 440px
      }

      .pills .pill:nth-child(3) {
        display: none
      }

      .brand small {
        display: none
      }
    }

    @media(max-width:480px) {
      .pills .pill:nth-child(2) {
        display: none
      }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important
      }
    }
  </style>
</head>

<body>
  <video id="video-bg" autoplay muted loop playsinline preload="auto">
    <source src="nova-bg.mp4" type="video/mp4">
  </video>
  <div class="wash"></div>

  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="logo" id="logo" aria-hidden="true"></div>
        <div><b>Nova</b><small>Voice assistant</small></div>
      </div>
      <div class="pills">
        <div class="pill"><i class="led ok" id="led-engine"></i>Engine <b id="diag-engine">Standby</b></div>
        <div class="pill"><i class="led wait" id="led-backend"></i>Backend <b id="diag-backend">Checking</b></div>
        <div class="pill">Latency <b id="diag-latency">-</b></div>
        <div class="pill">Voice <b id="diag-db">Silent</b></div>
        <div class="pill">Session <b id="diag-time">00:00:00</b></div>
        <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch to light theme" title="Switch theme">
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
      </div>
    </header>

    <div class="main">
      <section class="stage" aria-label="Nova">
        <div class="orb-wrap">
          <canvas id="orb" aria-hidden="true"></canvas>
          <div class="readout">
            <h1 id="core-word">Ready when you are</h1>
            <p id="core-sub">Press the mic and say a command</p>
          </div>
        </div>

        <div class="controls">
          <button class="mic" id="mic-btn" aria-label="Start listening">
            <svg class="m" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
              <path d="M19 11a7 7 0 0 1-14 0" />
              <path d="M12 18v4" />
            </svg>
            <svg class="stop" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="6" width="12" height="12" rx="3" />
            </svg>
          </button>
          <div class="cap" id="mic-caption">Tap to speak</div>
        </div>

        <div class="chips" id="chips">
          <button class="chip" data-cmd="open youtube"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="4" />
              <path d="M10 9l5 3-5 3z" />
            </svg>Open YouTube</button>
          <button class="chip" data-cmd="open google"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" />
            </svg>Open Google</button>
          <button class="chip" data-cmd="open linkedin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="4" />
              <path d="M8 11v5M8 8v.01M12 16v-5M12 13a2.5 2.5 0 0 1 5 0v3" />
            </svg>Open LinkedIn</button>
          <button class="chip" data-fill="search for "><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round">
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-4-4" />
            </svg>Search the web</button>
          <button class="chip" data-fill="play "><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V6l11-2v12" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="17" cy="16" r="3" />
            </svg>Play a track</button>
          <button class="chip" data-fill="open website "><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1" />
              <path d="M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1" />
            </svg>Open a website</button>
          <button class="chip" data-fill="generate a page about "><svg viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
              <path d="M14 3v5h5M9 13h6M9 17h4" />
            </svg>Generate a page</button>
        </div>
      </section>

      <aside class="chat" aria-label="Conversation">
        <div class="chat-head">
          <h2>Conversation</h2><button class="clear" id="clear">Clear</button>
        </div>
        <div class="log" id="transcript" aria-live="polite">
          <div class="empty" id="transcript-empty"><strong>Nothing here yet</strong>Say a command or type one below.
            Starting with "Nova" or "Jarvis" works too.</div>
        </div>
        <form class="composer" id="composer" autocomplete="off">
          <input id="text-input" type="text" placeholder="Type a command" aria-label="Type a command">
          <button class="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg></button>
        </form>
      </aside>
    </div>
  </div>

  <script>
    (function () {
      const $ = id => document.getElementById(id);
      const micBtn = $('mic-btn'), micCaption = $('mic-caption'), coreWord = $('core-word'), coreSub = $('core-sub');
      const transcript = $('transcript'), transcriptEmpty = $('transcript-empty');
      const diagEngine = $('diag-engine'), diagBackend = $('diag-backend'), diagLatency = $('diag-latency'), diagTime = $('diag-time');
      const ledBackend = $('led-backend'), textInput = $('text-input'), diagDb = $('diag-db');
      const root = document.documentElement;

      /* Theme (dark / light) */
      const THEME_KEY = 'nova-theme';
      const themeBtn = $('theme-btn'), metaTheme = $('meta-theme');
      let isLight = root.getAttribute('data-theme') === 'light';
      function applyTheme(t, persist) {
        isLight = t === 'light';
        root.setAttribute('data-theme', t);
        if (metaTheme) metaTheme.setAttribute('content', isLight ? '#f3f5fc' : '#0b0d1a');
        const label = isLight ? 'Switch to dark theme' : 'Switch to light theme';
        themeBtn.setAttribute('aria-label', label);
        themeBtn.title = label;
        if (persist) { try { localStorage.setItem(THEME_KEY, t); } catch (e) { } }
      }
      applyTheme(isLight ? 'light' : 'dark', false);
      themeBtn.addEventListener('click', () => applyTheme(isLight ? 'dark' : 'light', true));
      /* Jab tak user ne khud choose nahi kiya, system theme follow karo */
      try {
        matchMedia('(prefers-color-scheme: light)').addEventListener('change', ev => {
          let saved = null; try { saved = localStorage.getItem(THEME_KEY); } catch (e) { }
          if (!saved) applyTheme(ev.matches ? 'light' : 'dark', false);
        });
      } catch (e) { }

      /* Session timer */
      const sessionStart = Date.now();
      setInterval(() => {
        const t = Math.floor((Date.now() - sessionStart) / 1000);
        const p = n => String(n).padStart(2, '0');
        diagTime.textContent = p(Math.floor(t / 3600)) + ':' + p(Math.floor(t % 3600 / 60)) + ':' + p(t % 60);
      }, 1000);

      /* State */
      const STATES = {
        idle: { word: 'Ready when you are', sub: 'Press the mic and say a command', h: 200, speed: .0035, amp: .025, spin: 0 },
        listening: { word: 'Listening', sub: 'Go ahead, I am all ears', h: 155, speed: .007, amp: .10, spin: 0 },
        thinking: { word: 'Working on it', sub: 'One moment', h: 268, speed: .028, amp: .045, spin: 1 },
        speaking: { word: 'Speaking', sub: 'Playing the reply', h: 32, speed: .010, amp: .14, spin: 0 }
      };
      let state = 'idle';
      function setState(s) {
        state = STATES[s] ? s : 'idle';
        const c = STATES[state];
        coreWord.textContent = c.word;
        coreSub.textContent = c.sub;
        diagEngine.textContent = state.charAt(0).toUpperCase() + state.slice(1);
      }
      function setBackend(text, kind) {
        diagBackend.textContent = text;
        ledBackend.className = 'led ' + kind;
      }

      /* Audio levels: mic while listening, playback while speaking */
      let audioCtx = null, micStream = null, micAnalyser = null, outAnalyser = null;
      function getCtx() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx && AC) audioCtx = new AC();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      }
      async function startMic() {
        if (micStream) return;
        const ac = getCtx();
        if (!ac || !navigator.mediaDevices) return;
        try {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
          micAnalyser = ac.createAnalyser();
          micAnalyser.fftSize = 512;
          micAnalyser.smoothingTimeConstant = .55;
          ac.createMediaStreamSource(micStream).connect(micAnalyser);
        } catch (e) { micStream = null; micAnalyser = null }
      }
      function stopMic() {
        if (micStream) micStream.getTracks().forEach(tr => tr.stop());
        micStream = null; micAnalyser = null;
      }

      /* Orb */
      const cv = $('orb'), ctx = cv.getContext('2d');
      const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
      const N = 460, pts = [];
      for (let i = 0; i < N; i++) {
        const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963;
        pts.push({ x: Math.cos(th) * r, y: y, z: Math.sin(th) * r, s: Math.random() * 6.28 });
      }
      let W = 0, H = 0, dpr = 1;
      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        const b = cv.getBoundingClientRect();
        W = b.width; H = b.height;
        cv.width = W * dpr; cv.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      addEventListener('resize', resize); resize();
      const cur = { h: 200, speed: .0035, amp: .025 };
      let ang = 0, tilt = .35, t = 0, fr = 0, lvl = 0;
      const fbuf = new Uint8Array(256), tbuf = new Uint8Array(512);
      function sample() {
        const an = state === 'listening' ? micAnalyser : state === 'speaking' ? outAnalyser : null;
        if (!an) { fbuf.fill(0); return { rms: 0, live: false } }
        an.getByteFrequencyData(fbuf);
        an.getByteTimeDomainData(tbuf);
        let sum = 0;
        for (let i = 0; i < tbuf.length; i++) { const v = (tbuf[i] - 128) / 128; sum += v * v }
        return { rms: Math.sqrt(sum / tbuf.length), live: true };
      }
      function frame() {
        const c = STATES[state];
        cur.h += (c.h - cur.h) * .04;
        cur.speed += (c.speed - cur.speed) * .05;
        cur.amp += (c.amp - cur.amp) * .06;
        root.style.setProperty('--h', cur.h.toFixed(1));
        t += reduce ? 0 : .016;
        fr++;

        /* loudness: dBFS from the signal, mapped to 0..1 */
        const sm = sample();
        const db = sm.rms > .0005 ? 20 * Math.log10(sm.rms) : -90;
        let target = sm.live ? Math.min(1, Math.max(0, (db + 52) / 36)) : 0;
        if (target < .08) target = 0;
        if (state === 'speaking' && !sm.live) target = .3 + .3 * Math.pow(Math.sin(t * 7), 2);
        lvl += (target - lvl) * (target > lvl ? .4 : .1);
        if (fr % 6 === 0) diagDb.textContent = (sm.live && lvl > .02) ? Math.round(db) + ' dB' : 'Silent';

        ang += reduce ? 0 : cur.speed + lvl * .012;
        ctx.clearRect(0, 0, W, H);
        const cx = W / 2, cy = H * .44, R = Math.min(W * .28, H * .28, 160);
        const g = ctx.createRadialGradient(cx, cy, R * .2, cx, cy, R * 2.1);
        g.addColorStop(0, isLight ? 'hsla(' + cur.h + ',85%,60%,' + (.16 + lvl * .30) + ')' : 'hsla(' + cur.h + ',90%,62%,' + (.2 + lvl * .35) + ')');
        g.addColorStop(1, 'hsla(' + cur.h + ',90%,50%,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

        /* radial spectrum bars */
        const NB = 72, br = R * (1 + lvl * .15);
        ctx.lineCap = 'round'; ctx.lineWidth = 3;
        for (let i = 0; i < NB; i++) {
          const k = Math.min(i, NB - i);
          const mag = (fbuf[2 + Math.floor(k * 2.4)] || 0) / 255;
          const len = 3 + mag * R * .3;
          const an = i / NB * 6.2832 - 1.5708, co = Math.cos(an), si = Math.sin(an);
          ctx.strokeStyle = (isLight ? 'hsla(' + cur.h + ',80%,42%,' : 'hsla(' + cur.h + ',90%,72%,') + (.22 + mag * .78) + ')';
          ctx.beginPath();
          ctx.moveTo(cx + co * br, cy + si * br);
          ctx.lineTo(cx + co * (br + len), cy + si * (br + len));
          ctx.stroke();
        }

        /* particle sphere, size and wobble follow loudness */
        const amp = cur.amp + lvl * .3;
        const ca = Math.cos(ang), sa = Math.sin(ang), ct = Math.cos(tilt), st = Math.sin(tilt);
        const out = [];
        for (const p of pts) {
          const x = p.x * ca - p.z * sa, z = p.x * sa + p.z * ca, y = p.y;
          const y2 = y * ct - z * st, z2 = y * st + z * ct;
          const wob = 1 + amp * Math.sin(t * (state === 'thinking' ? 6 : 3) + p.s + y * 4) * (.6 + lvl * .8);
          const k = R * wob * (1 + lvl * .18), per = 1 / (1.9 - z2 * .55);
          out.push({ x: cx + x * k * per * 1.5, y: cy + y2 * k * per * 1.5, z: z2 });
        }
        out.sort((a, b) => a.z - b.z);
        for (const o of out) {
          const d = (o.z + 1) / 2;
          ctx.globalAlpha = .18 + d * .82;
          ctx.fillStyle = isLight
            ? 'hsl(' + (cur.h + d * 40) + ',80%,' + (58 - d * 22) + '%)'
            : 'hsl(' + (cur.h + d * 40) + ',90%,' + (55 + d * 25) + '%)';
          ctx.beginPath(); ctx.arc(o.x, o.y, .8 + d * 2.2 + lvl * d * 1.2, 0, 6.283); ctx.fill();
        }
        ctx.globalAlpha = 1;

        /* ripples that grow with volume */
        if (lvl > .05) {
          for (let i = 0; i < 2; i++) {
            const ph = ((t * .7 + i * .5) % 1);
            ctx.strokeStyle = (isLight ? 'hsla(' + cur.h + ',80%,45%,' : 'hsla(' + cur.h + ',90%,70%,') + (1 - ph) * (.15 + lvl * .5) + ')';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(cx, cy, R * (1.45 + ph * (.2 + lvl * .6)), 0, 6.283); ctx.stroke();
          }
        }
        requestAnimationFrame(frame);
      }
      frame();

      /* Transcript */
      function addMessage(role, text) {
        transcriptEmpty.style.display = 'none';
        const d = document.createElement('div');
        d.className = 'msg ' + (role === 'user' ? 'user' : 'nova');
        d.textContent = text;
        transcript.appendChild(d);
        transcript.scrollTop = transcript.scrollHeight;
      }
      $('clear').addEventListener('click', () => {
        transcript.querySelectorAll('.msg').forEach(m => m.remove());
        transcriptEmpty.style.display = '';
      });

      /* Backend */
      const BACKEND_URL = 'http://127.0.0.1:5000/api/command';
      const HEALTH_URL = 'http://127.0.0.1:5000/api/health';

      fetch(HEALTH_URL).then(r => r.json()).then(d => {
        d.openrouter_key_loaded ? setBackend('Connected', 'ok') : setBackend('No API key', 'bad');
      }).catch(() => setBackend('Offline', 'bad'));

      async function processCommand(raw) {
        setBackend('Contacting', 'wait');
        try {
          const res = await fetch(BACKEND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              text: raw,
              instruction: 'If this is a search request, return/open the search results only; do not play audio or start a song.'
            })
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          setBackend('Connected', 'ok');
          return {
            reply: data.reply || "I didn't get a reply from the AI backend.",
            audio: data.audio_base64 || null,
            audioFormat: data.audio_format || 'mp3'
          };
        } catch (err) {
          setBackend('Offline', 'bad');
          return {
            reply: "I can't reach the AI backend right now. Make sure jervish.py is running with 'python jervish.py web'.",
            audio: null, audioFormat: 'mp3'
          };
        }
      }

      let currentAudio = null;
      function speak(result, onDone) {
        const text = typeof result === 'string' ? result : result.reply;
        const audioBase64 = typeof result === 'string' ? null : result.audio;
        const audioFormat = typeof result === 'string' ? 'mp3' : (result.audioFormat || 'mp3');
        setState('speaking');
        addMessage('nova', text);
        if (currentAudio) { currentAudio.pause(); currentAudio = null }
        const done = () => { outAnalyser = null; setState('idle'); if (onDone) onDone() };
        if (audioBase64) {
          const mime = audioFormat === 'wav' ? 'audio/wav' : 'audio/mpeg';
          currentAudio = new Audio('data:' + mime + ';base64,' + audioBase64);
          try {
            const ac = getCtx();
            const src = ac.createMediaElementSource(currentAudio);
            outAnalyser = ac.createAnalyser();
            outAnalyser.fftSize = 512;
            outAnalyser.smoothingTimeConstant = .5;
            src.connect(outAnalyser);
            outAnalyser.connect(ac.destination);
          } catch (e) { outAnalyser = null }
          currentAudio.onended = done;
          currentAudio.onerror = done;
          currentAudio.play().catch(done);
        } else {
          setTimeout(done, 900);
        }
      }

      /* One pipeline for voice, typed text and chips */
      let convoActive = false, recognizing = false, recognizer = null;

      function resumeListening() {
        if (convoActive && recognizer) { try { recognizer.start() } catch (e) { } }
      }

      function runCommand(said, viaVoice) {
        said = (said || '').trim();
        if (!said) return;
        getCtx();
        const t0 = performance.now();
        addMessage('user', said);
        setState('thinking');
        diagLatency.textContent = '-';

        const m = said.match(/^(jarvis|jervish|nova)[,]?\s*(.*)$/i);
        let toProcess = said, justWake = false;
        if (m) {
          const rest = m[2].trim();
          if (!rest) justWake = true; else toProcess = rest;
        }
        const after = viaVoice ? resumeListening : null;

        setTimeout(() => {
          diagLatency.textContent = Math.round(performance.now() - t0) + ' ms';
          if (justWake) {
            speak("Yes? Go ahead, I'm listening.", after);
          } else {
            processCommand(toProcess).then(r => speak(r, after));
          }
        }, 380);
      }

      /* Speech recognition */
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      function idleCaption() { micCaption.textContent = 'Tap to speak' }

      if (SR) {
        recognizer = new SR();
        recognizer.continuous = false;
        recognizer.interimResults = false;
        recognizer.lang = 'en-US';

        recognizer.onstart = () => {
          recognizing = true;
          micBtn.classList.add('active');
          micBtn.setAttribute('aria-label', 'Stop listening');
          micCaption.textContent = convoActive ? 'Listening, conversation is on' : 'Listening';
          setState('listening');
          startMic();
        };
        recognizer.onresult = e => {
          const said = e.results[0][0].transcript.trim();
          if (!said) return;
          convoActive = true;
          runCommand(said, true);
        };
        recognizer.onerror = e => {
          if (e.error === 'no-speech') {
            convoActive = false; setState('idle'); idleCaption();
          } else if (e.error === 'aborted') {
            /* intentional stop */
          } else {
            addMessage('nova', 'Recognition error: ' + e.error);
            convoActive = false; setState('idle'); idleCaption();
          }
        };
        recognizer.onend = () => {
          recognizing = false;
          micBtn.classList.remove('active');
          micBtn.setAttribute('aria-label', 'Start listening');
          if (!convoActive) {
            stopMic();
            idleCaption();
            if (state === 'listening') setState('idle');
          }
        };
      } else {
        micCaption.textContent = 'Mic not supported here. Use Chrome or Edge, or type below.';
      }

      micBtn.addEventListener('click', () => {
        if (!SR) {
          addMessage('nova', 'This browser does not support the Web Speech API. Please use Chrome or Edge, or type your command instead.');
          return;
        }
        getCtx();
        if (recognizing) {
          convoActive = false;
          recognizer.stop();
        } else {
          convoActive = true;
          try { recognizer.start() } catch (e) { }
        }
      });

      /* Typed input */
      $('composer').addEventListener('submit', e => {
        e.preventDefault();
        const v = textInput.value;
        textInput.value = '';
        runCommand(v, false);
      });

      /* Quick actions */
      $('chips').addEventListener('click', e => {
        const b = e.target.closest('.chip');
        if (!b) return;
        if (b.dataset.cmd) {
          runCommand(b.dataset.cmd, false);
        } else {
          textInput.value = b.dataset.fill;
          textInput.focus();
        }
      });

      /* Background video: retry muted playback once */
      const video = $('video-bg');
      video.addEventListener('error', () => { video.style.display = 'none' });
      video.play().catch(() => { });
    })();
  </script>
</body>

</html>
